[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-pulse-monitor"
version = "0.1.0"
description = "脉冲 Pulse — Ubuntu 原生资源、进程与端口监控"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "PySide6==6.9.2",
  "PySide6-Fluent-Widgets==1.11.3",
  "psutil>=6.1,<8",
  "pyqtgraph==0.14.0",
  "nvidia-ml-py>=12,<14",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
pulse-monitor = "pulse_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["pulse_monitor*"]

[tool.setuptools.package-data]
pulse_monitor = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
